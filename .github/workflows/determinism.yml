# Cross-platform determinism: every lpf_bench rung at workers 1 and 8 on each OS, CPU and compiler, plus x64
# binaries under emulation on ARM64, and a probe of the C library functions the engine calls. The summary job diffs
# every leg against windows-x64-msvc (the committed baseline's toolchain) into a table in the job summary, and fails
# the run when a leg that must match it does not (summarize.py's verdict).
name: determinism

on:
  push:
    branches: [sandbox, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: windows-x64-msvc, os: windows-latest, vsarch: x64, keepbin: true }
          - { leg: windows-x64-clangcl, os: windows-latest, vsarch: x64, toolset: ClangCL }
          - { leg: windows-arm64-msvc, os: windows-11-arm, vsarch: ARM64 }
          - { leg: linux-x64-gcc, os: ubuntu-latest, cc: gcc, cxx: g++, keepbin: true, pair: true }
          - { leg: linux-x64-clang, os: ubuntu-latest, cc: clang, cxx: clang++ }
          # control: contraction stays off, but gcc may use every instruction of the runner's CPU (FMA, AVX-512)
          - { leg: linux-x64-gcc-native, os: ubuntu-latest, cc: gcc, cxx: g++, cflags: -march=native }
          - { leg: linux-arm64-gcc, os: ubuntu-24.04-arm, cc: gcc, cxx: g++ }
          - { leg: linux-arm64-clang, os: ubuntu-24.04-arm, cc: clang, cxx: clang++ }
          # positive control: FMA contraction back on (ARM64 always has FMA), which must change the hashes
          - { leg: linux-arm64-gcc-contract, os: ubuntu-24.04-arm, cc: gcc, cxx: g++, contract: true }
          - { leg: macos-arm64-clang, os: macos-latest, cc: clang, cxx: clang++, osxarch: arm64 }
          # x86_64 build run under Rosetta 2 on the same Apple silicon runner
          - { leg: macos-x64-rosetta, os: macos-latest, cc: clang, cxx: clang++, osxarch: x86_64, runner: arch -x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          args=(-DLPF_SANDBOX=OFF -DLPF_WARNINGS_AS_ERRORS=OFF)
          if [ "$RUNNER_OS" = "Windows" ]; then
            gen=(-A "${{ matrix.vsarch }}") # CMake's default here: the newest Visual Studio on the runner
            if [ -n "${{ matrix.toolset }}" ]; then gen+=(-T "${{ matrix.toolset }}"); fi
          else
            gen=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
            if [ -n "${{ matrix.osxarch }}" ]; then gen+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osxarch }}); fi
            if [ -n "${{ matrix.cflags }}" ]; then gen+=("-DCMAKE_C_FLAGS=${{ matrix.cflags }}"); fi
          fi
          lpf=()
          if [ "${{ matrix.contract }}" = "true" ]; then
            lpf+=("-DCMAKE_C_COMPILER_LAUNCHER=sh;$GITHUB_WORKSPACE/.github/determinism/contract-launcher.sh")
          fi
          cmake -S . -B build/default "${gen[@]}" "${args[@]}" "${lpf[@]}"
          cmake -S .github/determinism -B build/probe "${gen[@]}"

      - name: Build
        shell: bash
        run: |
          for b in default probe; do cmake --build build/$b --config Release --parallel 4 || exit 1; done

      - name: Run
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then sub=bin/Release; exe=.exe; else sub=bin; exe=; fi
          echo "BIN_SUB=$sub" >> "$GITHUB_ENV"
          echo "EXE=$exe" >> "$GITHUB_ENV"
          out=out
          mkdir -p $out/probe $out/bin
          if [ "${{ matrix.osxarch }}" = "x86_64" ]; then sudo softwareupdate --install-rosetta --agree-to-license || true; fi
          {
            grep -hE 'CMAKE_C_COMPILER_(ID|VERSION) ' build/default/CMakeFiles/*/CMakeCCompiler.cmake | sed 's/set(//; s/)//' | tr '\n' ' '
            echo
            uname -a 2>/dev/null || echo windows
            file build/default/$sub/lpf_bench$exe 2>/dev/null || true
          } > $out/info.txt
          cat $out/info.txt
          ${{ matrix.runner }} build/probe/$sub/libm_probe$exe $out/probe | tee $out/probe.txt
          if [ -f build/probe/$sub/libm_probe_static$exe ]; then
            mkdir -p $out/probe_static
            build/probe/$sub/libm_probe_static$exe $out/probe_static | tee $out/probe_static.txt
          fi
          bash .github/determinism/ladder.sh build/default/$sub/lpf_bench$exe $out/default ${{ matrix.runner }}

      # The tests gate every leg. The positive control must fail the determinism self-test (contraction changes its
      # answers) and is not asked for the rest.
      - name: Tests
        shell: bash
        timeout-minutes: 15
        run: |
          code=0
          if [ "${{ matrix.contract }}" = "true" ]; then
            ${{ matrix.runner }} build/default/$BIN_SUB/lpf_test$EXE world TestDeterminismSelfTest > out/test_log.txt 2>&1 || code=$?
            if [ $code -ne 0 ]; then verdict="as it must"; else verdict="it must fail"; fi
            echo "exit $code: the self-test under contraction, $verdict" > out/test.txt
            cat out/test.txt
            [ $code -ne 0 ]
            exit $?
          fi
          ${{ matrix.runner }} build/default/$BIN_SUB/lpf_test$EXE > out/test_log.txt 2>&1 || code=$?
          ${{ matrix.runner }} build/default/$BIN_SUB/lpf_test$EXE --check-catalogue docs/catalogue.md >> out/test_log.txt 2>&1 || code=$?
          echo "exit $code: $(grep -E -m 3 'FAILED|catalogue: .*names|not name' out/test_log.txt | tr '\n' ' ') $(tail -n 1 out/test_log.txt)" > out/test.txt
          cat out/test.txt
          exit $code

      # One leg runs the kept hash against a full one every tick, and processes in lockstep over localhost: in sync to
      # the end (every machine exits 0), with a desync injected into the peer (every machine names the body and exits
      # 4), with the peer's link slow (80 ms and up to 40 more each way) or stalled for 2 s (in sync all the same), and
      # three machines of which one leaves (the other two are told, and exit 6)
      - name: Lockstep pair and the kept hash
        if: matrix.pair
        shell: bash
        timeout-minutes: 20
        run: |
          bench=build/default/$BIN_SUB/lpf_bench$EXE
          $bench --scene town --period 3 --ticks 300 --workers 1,8 --check-hash > out/check_hash.txt 2>&1
          town="--scene town --period 12 --ticks 300"
          # pair <name> <port> <host's extra flags> <peer's extra flags> [<second peer's flags>]: sets codes to the exit codes
          pair() {
            local name=$1 port=$2 pids=() k=0
            $bench $town --host 127.0.0.1:$port $3 > out/${name}_host.txt 2>&1 & pids+=($!)
            $bench $town --join 127.0.0.1:$port $4 > out/${name}_peer.txt 2>&1 & pids+=($!)
            if [ $# -ge 5 ]; then sleep 1; $bench $town --join 127.0.0.1:$port $5 > out/${name}_peer2.txt 2>&1 & pids+=($!); fi
            codes=""
            for pid in "${pids[@]}"; do c=0; wait $pid || c=$?; codes="$codes $c"; done
            echo "$name: exit codes (host, peers):$codes"
            tail -n 1 out/${name}_*.txt
          }
          pair sync 7777 "" "--script scripts/walls_demo.txt"
          [ "$codes" = " 0 0" ]
          pair desync 7778 "" "--inject-desync 150"
          [ "$codes" = " 4 4" ] && grep -q "bodies element" out/desync_host.txt && grep -q "bodies element" out/desync_peer.txt
          pair slow 7779 "" "--script scripts/walls_demo.txt --net-delay 80,40"
          [ "$codes" = " 0 0" ]
          pair stall 7780 "" "--net-stall 100,2000"
          [ "$codes" = " 0 0" ]
          pair leave 7781 "--peers 2" "" "--leave-at 150"
          [ "$codes" = " 6 6 0" ] && grep -q "peer [12] left" out/leave_host.txt && grep -q "peer [12] left" out/leave_peer.txt

      - name: Keep the x64 binaries for the emulators
        if: matrix.keepbin
        shell: bash
        run: |
          mkdir -p emu
          cp build/default/$BIN_SUB/lpf_bench$EXE emu/lpf_bench$EXE
          cp build/probe/$BIN_SUB/libm_probe$EXE emu/libm_probe$EXE
          cp build/probe/$BIN_SUB/libm_probe_static$EXE emu/ 2>/dev/null || true
          cp .github/determinism/ladder.sh emu/
          cp out/info.txt emu/native_info.txt

      - uses: actions/upload-artifact@v4
        if: matrix.keepbin
        with:
          name: emu-bin-${{ matrix.leg }}
          path: emu

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: det-${{ matrix.leg }}
          path: out
          retention-days: 30

  # x64 binaries from the native legs, unchanged, under x64 emulation on ARM64: box64 on Linux, Prism on Windows
  emulated:
    name: ${{ matrix.leg }}
    needs: native
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: box64-default, os: ubuntu-24.04-arm, bin: linux-x64-gcc, emu: box64 }
          - { leg: box64-strict, os: ubuntu-24.04-arm, bin: linux-x64-gcc, emu: box64, env: "BOX64_DYNAREC_FASTNAN=0 BOX64_DYNAREC_FASTROUND=0" }
          - { leg: prism-windows-arm64, os: windows-11-arm, bin: windows-x64-msvc, emu: prism }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emu-bin-${{ matrix.bin }}
          path: emu

      - name: Build box64
        if: matrix.emu == 'box64'
        run: |
          git clone --depth 1 --branch v0.4.4 https://github.com/ptitSeb/box64 box64-src || git clone --depth 1 https://github.com/ptitSeb/box64 box64-src
          cmake -S box64-src -B box64-build -DARM_DYNAREC=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build box64-build --parallel 4
          sudo cmake --install box64-build || true
          (cd box64-src && git log -1 --format='box64 %H %cd')

      - name: Run
        shell: bash
        run: |
          out=out
          mkdir -p $out/probe
          if [ "${{ matrix.emu }}" = "box64" ]; then
            chmod +x emu/lpf_bench emu/libm_probe
            export ${{ matrix.env }} BOX64_LOG=0 BOX64_NOBANNER=1
            run=$(command -v box64 || echo box64-build/box64)
            exe=
            what="box64 $($run --version 2>&1 | head -n 1) env: ${{ matrix.env }}"
          else
            run=  # Windows on ARM runs x64 executables through Prism by itself
            exe=.exe
            what="Prism: x64 executable on $PROCESSOR_ARCHITECTURE Windows"
          fi
          { echo "$what"; cat emu/native_info.txt; uname -a; } > $out/info.txt
          cat $out/info.txt
          $run emu/libm_probe$exe $out/probe | tee $out/probe.txt
          if [ -f emu/libm_probe_static$exe ]; then
            mkdir -p $out/probe_static
            $run emu/libm_probe_static$exe $out/probe_static | tee $out/probe_static.txt
          fi
          bash emu/ladder.sh emu/lpf_bench$exe $out/default $run
          echo "not run (emulated)" > $out/test.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: det-${{ matrix.leg }}
          path: out
          retention-days: 30

  summary:
    needs: [native, emulated]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: det-*
          path: artifacts
      # Fails the run when a leg that must match the reference does not (the summary's verdict), after writing it
      - name: Diff the legs
        run: |
          code=0
          python3 .github/determinism/summarize.py artifacts summary.md || code=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: summary.md
